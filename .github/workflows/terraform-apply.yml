name: Terraform apply

# Manual apply on main only. The production environment is the approval gate.
# Never triggered by push or pull_request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-apply-jarvis-gg
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Refusing to plan an apply from ${GITHUB_REF}. Run this workflow from main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Require secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            value="${!name-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "Apply needs these GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure R2 backend
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: ./scripts/write-backend-hcl.sh cloudflare/jarvis-gg/backend.hcl

      - name: terraform init
        working-directory: cloudflare/jarvis-gg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: terraform plan
        working-directory: cloudflare/jarvis-gg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_IN_AUTOMATION: "true"
        run: terraform plan -input=false -no-color

  apply:
    name: apply
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Require main
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Refusing to apply from ${GITHUB_REF}. Run this workflow from main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Configure R2 backend
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: ./scripts/write-backend-hcl.sh cloudflare/jarvis-gg/backend.hcl

      - name: terraform init
        working-directory: cloudflare/jarvis-gg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: terraform apply
        working-directory: cloudflare/jarvis-gg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_IN_AUTOMATION: "true"
        run: terraform apply -input=false -auto-approve
