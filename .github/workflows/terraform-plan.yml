name: Terraform plan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  terraform:
    name: fmt, validate, tflint, plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform -chdir=cloudflare/jarvis-gg init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=cloudflare/jarvis-gg validate

      - name: tflint
        run: tflint --chdir=cloudflare/jarvis-gg --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Check plan secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT; do
            value="${!name-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              missing+=("$name")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipping terraform plan. Missing GitHub Actions secrets: ${missing[*]}"
            echo "fmt, validate, and tflint already ran. Secret names are listed in the README."
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Configure R2 backend
        if: steps.secrets.outputs.present == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: ./scripts/write-backend-hcl.sh cloudflare/jarvis-gg/backend.hcl

      - name: terraform init (remote state)
        if: steps.secrets.outputs.present == 'true'
        working-directory: cloudflare/jarvis-gg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: terraform plan
        id: plan
        if: steps.secrets.outputs.present == 'true'
        working-directory: cloudflare/jarvis-gg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_IN_AUTOMATION: "true"
        run: |
          set +e
          terraform plan -input=false -no-color > "$GITHUB_WORKSPACE/plan.txt" 2>&1
          status=$?
          set -e
          cat "$GITHUB_WORKSPACE/plan.txt"
          if [[ "$status" -eq 1 ]]; then
            echo "status=error" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment plan on the pull request
        if: steps.secrets.outputs.present == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan:cloudflare/jarvis-gg -->";
            let plan = fs.readFileSync("plan.txt", "utf8");
            const max = 60000;
            if (plan.length > max) {
              plan = plan.slice(0, max) + "\n...[truncated]";
            }
            plan = plan.replace(/```/g, "'''");
            const body = [
              marker,
              "## Terraform plan (`cloudflare/jarvis-gg`)",
              "",
              "After the import apply, the only accepted plan is `No changes` or `10 to add, 0 to change, 1 to destroy` (delete A 46.101.80.89, add GitHub Pages records, leave MX alone).",
              "",
              "```",
              plan.trimEnd(),
              "```",
              "",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Require the GitHub Pages cutover plan
        if: steps.secrets.outputs.present == 'true' && steps.plan.outputs.status == 'ok'
        run: python3 scripts/assert-import-only-plan.py plan.txt

      - name: Fail when terraform plan errored
        if: steps.secrets.outputs.present == 'true' && steps.plan.outputs.status == 'error'
        run: exit 1
